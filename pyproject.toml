[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "okapy"
version = "0.3.0"
description = "Modular biomedical image conversion, preprocessing, and feature extraction"
authors = [
    { name = "Valentin Oreiller", email = "valentin.oreiller@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

keywords = [
    "okapy",
    "biomedical",
    "dicom",
    "radiomics",
    "medical-imaging",
]

dependencies = [
    "SimpleITK>=2.2",
    "numpy>=1.23",
    "pandas>=1.5",
    "pydicom>=3.0",
    # highdicom 0.28 changed the SEG reading API used by
    # okapy.dicom.conversion.seg_highdicom_adapter.
    "highdicom>=0.27,<0.28",
    "PyYAML>=5.4",
    "scikit-image>=0.20",
]

[project.optional-dependencies]
radiomics = [
    # pyradiomics 3.0.1 wheels are built against NumPy 1.x.
    "pyradiomics==3.0.1; python_version == '3.10'",
    "numpy<2; python_version == '3.10'",
]

cli = [
    "click",
]

dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
    # find_packages check in tests/unit/test_packaging.py (not bundled with 3.12 venvs).
    "setuptools>=61",
    # Parquet golden files.
    "pyarrow",
    # Used by the frozen okapy_legacy reference code exercised in tests.
    "scipy",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/voreille/okapy"
Repository = "https://github.com/voreille/okapy"


[tool.setuptools.packages.find]
where = ["src"]
include = ["okapy", "okapy.*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs external DICOM data (OKAPY_TEST_DATA / SUV_COMPUTATION_TEST_DATA)",
    "radiomics: needs a working pyradiomics install",
]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["src/okapy_legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["okapy", "tests"]

[tool.mypy]
files = ["src/okapy"]
python_version = "3.10"
ignore_missing_imports = true