name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/okapy tests
      - run: ruff format --check src/okapy tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            coverage-core: ""
          # coverage's default tracer is ~100x slower on 3.12 for highdicom's
          # pure-Python SEG encoding; sys.monitoring (3.12+) avoids that.
          - python-version: "3.12"
            coverage-core: "sysmon"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -m "not integration" --cov=okapy --cov-report=term
        env:
          COVERAGE_CORE: ${{ matrix.coverage-core }}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      - name: Check wheel contents
        run: |
          unzip -l dist/*.whl > wheel.txt
          grep -q "okapy/dicom/__init__.py" wheel.txt
          grep -q "okapy/dicom/conversion/__init__.py" wheel.txt
          ! grep -q "okapy_legacy" wheel.txt
