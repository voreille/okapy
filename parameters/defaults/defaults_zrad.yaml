general:
  padding: 10
  submodalities: True
  combine_segmentation: False
  result_format: "long"
  additional_dicom_tags:
    - "SeriesInstanceUID"
    - "SeriesDescription"

volume_preprocessing:
  common:
    bspline_resampler:
      resampling_spacing: [1.0, 1.0, 1.0]
      order: 3
  default:

mask_preprocessing:
  default:
    binary_bspline_resampler:
      # Masks are binary: B-spline rings on the 0/1 boundary and leaves speckle
      # and pinholes after thresholding. Order 1 (linear + 0.5 threshold) is the
      # IBSI-sanctioned fractional route. The image resampler above keeps
      # order 3, which is correct for continuous data.
      order: 1

feature_extraction:
  common:
    zrad:
      extractor0:
        structure: "test"
        n_bins: 5
        bin_size:
        compute_wavelet: False
        outlier: False
